<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sprite Iconic Crisp Green Radial Background -->
    <radialGradient id="spriteGreenBg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#00A653" />
      <stop offset="50%" stop-color="#008B47" />
      <stop offset="100%" stop-color="#005C2E" />
    </radialGradient>

    <!-- Sprite Lemon-Lime Border Ring -->
    <linearGradient id="spriteRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E100" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00A653" stop-opacity="0.3" />
    </linearGradient>

    <!-- Facet 1: Left Pillar (Crisp Sprite White with subtle sheen) -->
    <linearGradient id="whitePillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>

    <!-- Facet 2: Left Diagonal (Lemon-Lime highlight) -->
    <linearGradient id="lemonLimeDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#F4E100" />
      <stop offset="100%" stop-color="#d4c200" />
    </linearGradient>

    <!-- Facet 3: Right Diagonal (Crisp White to Emerald shadow) -->
    <linearGradient id="whiteRightDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Facet 4: Right Pillar (Crisp White with Lemon-Lime accent) -->
    <linearGradient id="whiteRightPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#bbf7d0" />
    </linearGradient>

    <!-- Sharp Clean Drop Shadow for the 'M' -->
    <filter id="crispDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#003D1F" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Sprite Green Background Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#spriteGreenBg)" />

  <!-- Subtle Lemon-Lime / White Border Line -->
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="url(#spriteRingGrad)" stroke-width="3" />

  <!-- Lemon-Lime Starburst Sparkle in top corner -->
  <circle cx="395" cy="115" r="14" fill="#F4E100" />

  <!-- BOLD, HIGH-CONTRAST MONOGRAM 'CME' IN CRISP WHITE & LEMON-LIME -->
  <g filter="url(#crispDropShadow)">
    <text 
      x="256" 
      y="310" 
      font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
      font-size="140" 
      font-weight="900" 
      letter-spacing="2" 
      text-anchor="middle" 
      fill="url(#whitePillar)" 
      stroke="#F4E100" 
      stroke-width="2"
    >
      CME
    </text>
  </g>
</svg>
