<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="cyanText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="goldM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGrad4)" />

  <!-- Matrix Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Left Side: Brand Logo Badge (Safe margin x=140) -->
  <g transform="translate(140, 30)">
    <rect x="0" y="0" width="180" height="56" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.95" />
    
    <g transform="translate(10, 8)">
      <rect width="40" height="40" rx="8" fill="#1e293b" />
      <path d="M 10 30 L 10 12 L 20 24 L 30 12 L 30 30" fill="none" stroke="url(#goldM)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <text x="58" y="30" font-family="sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="1.5">CME</text>
    <text x="58" y="44" font-family="sans-serif" font-weight="700" font-size="8" fill="#38bdf8" letter-spacing="1">QUANT BOT ENGINE</text>
  </g>

  <!-- Header Title (Safe margin x=460 to 1060) -->
  <g transform="translate(460, 30)">
    <text x="0" y="32" font-family="sans-serif" font-weight="900" font-size="28" fill="#ffffff">24/7 AUTOMATED QUANT BOT LOGIC</text>
    <rect x="0" y="44" width="310" height="22" rx="11" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
    <text x="12" y="59" font-family="sans-serif" font-weight="700" font-size="10" fill="#38bdf8">High Frequency Algorithmic Arbitrage Execution</text>
  </g>

  <!-- Flowchart Diagram: Bot Execution Logic (x=140 to 1060) -->
  <g transform="translate(140, 130)">
    <!-- Node 1: Market Data Stream -->
    <rect x="0" y="40" width="230" height="130" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <rect x="15" y="55" width="200" height="24" rx="8" fill="#f59e0b" opacity="0.15" />
    <text x="115" y="72" font-family="sans-serif" font-weight="900" font-size="11" fill="#fef08a" text-anchor="middle">STEP 1: MARKET STREAM</text>
    <text x="115" y="115" font-family="sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle">350+ PAIRS LIVE</text>
    <text x="115" y="142" font-family="sans-serif" font-weight="600" font-size="11" fill="#94a3b8" text-anchor="middle">Binance / OKX / Bybit</text>

    <!-- Arrow 1 -->
    <g transform="translate(230, 105)">
      <line x1="10" y1="0" x2="80" y2="0" stroke="#38bdf8" stroke-width="3" stroke-dasharray="5,5" filter="url(#neonGlow)" />
      <polygon points="80,0 70,-6 70,6" fill="#38bdf8" />
    </g>

    <!-- Node 2: Quant Bot Arbitrage Engine -->
    <g transform="translate(320, 20)">
      <rect x="0" y="0" width="280" height="170" rx="20" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5" />
      <rect x="20" y="20" width="240" height="28" rx="10" fill="#818cf8" opacity="0.2" />
      <text x="140" y="39" font-family="sans-serif" font-weight="900" font-size="12" fill="#c084fc" text-anchor="middle">STEP 2: AI QUANT BOT</text>

      <polygon points="140,60 210,105 140,150 70,105" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <text x="140" y="100" font-family="sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">ARBITRAGE</text>
      <text x="140" y="116" font-family="sans-serif" font-weight="800" font-size="10" fill="#38bdf8" text-anchor="middle">SCANNER</text>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(600, 105)">
      <line x1="10" y1="0" x2="80" y2="0" stroke="#34d399" stroke-width="3" stroke-dasharray="5,5" filter="url(#neonGlow)" />
      <polygon points="80,0 70,-6 70,6" fill="#34d399" />
    </g>

    <!-- Node 3: Instant Order Execution -->
    <rect x="690" y="40" width="230" height="130" rx="16" fill="#022c22" stroke="#10b981" stroke-width="2" />
    <rect x="705" y="55" width="200" height="24" rx="8" fill="#10b981" opacity="0.2" />
    <text x="805" y="72" font-family="sans-serif" font-weight="900" font-size="11" fill="#a7f3d0" text-anchor="middle">STEP 3: AUTO EXECUTE</text>
    <text x="805" y="115" font-family="sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle">&lt; 5ms LATENCY</text>
    <text x="805" y="142" font-family="sans-serif" font-weight="600" font-size="11" fill="#34d399" text-anchor="middle">Direct Profit Yield</text>
  </g>
</svg>
