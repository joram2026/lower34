<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgGradBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="goldBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="glowBrand" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGradBrand)" />

  <!-- Background Lines -->
  <g stroke="#f59e0b" stroke-width="1" opacity="0.12">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Left Side: Brand Logo Badge (Safe margin x=140) -->
  <g transform="translate(140, 30)">
    <rect x="0" y="0" width="180" height="56" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" opacity="0.95" />
    
    <g transform="translate(10, 8)">
      <rect width="40" height="40" rx="8" fill="#1e293b" />
      <path d="M 10 30 L 10 12 L 20 24 L 30 12 L 30 30" fill="none" stroke="url(#goldBrand)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <text x="58" y="30" font-family="sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="1.5">CME</text>
    <text x="58" y="44" font-family="sans-serif" font-weight="700" font-size="8" fill="#80D824" letter-spacing="1">GLOBAL BRAND</text>
  </g>

  <!-- Certificate Doc Graphic Mockup (x=140, y=105) -->
  <g transform="translate(140, 105)">
    <rect width="210" height="260" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2" filter="url(#glowBrand)" />
    <rect x="15" y="15" width="180" height="230" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    
    <!-- Stamp Seal -->
    <circle cx="105" cy="75" r="30" fill="url(#goldBrand)" />
    <circle cx="105" cy="75" r="24" fill="#0f172a" />
    <text x="105" y="80" font-family="sans-serif" font-weight="900" font-size="13" fill="#80D824" text-anchor="middle">CME</text>

    <text x="105" y="130" font-family="sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">OFFICIAL LICENSE</text>
    <text x="105" y="148" font-family="sans-serif" font-weight="700" font-size="9" fill="#f59e0b" text-anchor="middle">GLOBAL TRADING CORP</text>

    <rect x="35" y="165" width="140" height="6" rx="3" fill="#334155" />
    <rect x="35" y="180" width="140" height="6" rx="3" fill="#334155" />
    <rect x="35" y="195" width="100" height="6" rx="3" fill="#334155" />

    <text x="105" y="225" font-family="sans-serif" font-weight="800" font-size="9" fill="#34d399" text-anchor="middle">VERIFIED &amp; AUDITED</text>
  </g>

  <!-- Main Brand Title & Description (x=380 to 1060) -->
  <g transform="translate(380, 110)">
    <text x="0" y="42" font-family="sans-serif" font-weight="900" font-size="38" fill="#ffffff" letter-spacing="1">CME GLOBAL TRADING</text>
    <text x="0" y="82" font-family="sans-serif" font-weight="900" font-size="32" fill="url(#goldBrand)" letter-spacing="0.5">NEXT-GEN FINANCIAL ENGINE</text>

    <!-- Subtitle Pill -->
    <g transform="translate(0, 105)">
      <rect width="360" height="32" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="180" y="21" font-family="sans-serif" font-weight="800" font-size="12" fill="#fde047" text-anchor="middle">EMPOWERING INTERNATIONAL ARBITRAGE</text>
    </g>

    <!-- Feature Badges -->
    <g transform="translate(0, 160)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="50" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
        <text x="90" y="22" font-family="sans-serif" font-weight="800" font-size="11" fill="#34d399" text-anchor="middle">INSTANT PAYOUTS</text>
        <text x="90" y="38" font-family="sans-serif" font-weight="700" font-size="9" fill="#94a3b8" text-anchor="middle">Automated Processing</text>
      </g>

      <!-- Badge 2 -->
      <g transform="translate(195, 0)">
        <rect width="180" height="50" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
        <text x="90" y="22" font-family="sans-serif" font-weight="800" font-size="11" fill="#38bdf8" text-anchor="middle">24/7 LIQUIDITY</text>
        <text x="90" y="38" font-family="sans-serif" font-weight="700" font-size="9" fill="#94a3b8" text-anchor="middle">Deep Market Access</text>
      </g>

      <!-- Badge 3 -->
      <g transform="translate(390, 0)">
        <rect width="180" height="50" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
        <text x="90" y="22" font-family="sans-serif" font-weight="800" font-size="11" fill="#fbbf24" text-anchor="middle">VIP REWARDS</text>
        <text x="90" y="38" font-family="sans-serif" font-weight="700" font-size="9" fill="#94a3b8" text-anchor="middle">Up to +20% Bonus</text>
      </g>
    </g>
  </g>
</svg>
