<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Dark Office Background -->
    <linearGradient id="officeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="60%" stop-color="#060a12" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Skyline Glass Glow -->
    <linearGradient id="skylineGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1" />
    </linearGradient>

    <!-- Logo Glow -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="1.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Screen Glow Filter -->
    <filter id="screenGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#f59e0b" flood-opacity="0.25" />
    </filter>

    <!-- Wall Emblem Gold Gradient -->
    <linearGradient id="wallEmblemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Screen Chart Blue Gradient -->
    <linearGradient id="chartBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="chartGreen" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- 1. Office Room Canvas -->
  <rect width="1600" height="900" fill="url(#officeBg)" />

  <!-- 2. Floor to Ceiling Glass Windows & Night City Skyline -->
  <g id="city-skyline" opacity="0.65">
    <rect x="900" y="80" width="700" height="600" fill="url(#skylineGrad)" rx="12" />
    <!-- Window Frame Grid -->
    <line x1="900" y1="80" x2="900" y2="680" stroke="#334155" stroke-width="6" />
    <line x1="1133" y1="80" x2="1133" y2="680" stroke="#1e293b" stroke-width="8" />
    <line x1="1366" y1="80" x2="1366" y2="680" stroke="#1e293b" stroke-width="8" />
    <line x1="900" y1="350" x2="1600" y2="350" stroke="#1e293b" stroke-width="6" />

    <!-- Skyscrapers silhouettes -->
    <rect x="940" y="240" width="80" height="440" fill="#0f172a" />
    <rect x="1040" y="160" width="110" height="520" fill="#0b1329" />
    <polygon points="1095,90 1040,160 1150,160" fill="#0b1329" /> <!-- Tower Spire -->
    <rect x="1170" y="220" width="90" height="460" fill="#0f172a" />
    <rect x="1280" y="180" width="120" height="500" fill="#090e1a" />
    <rect x="1420" y="260" width="110" height="420" fill="#0f172a" />

    <!-- City Lights -->
    <circle cx="1095" cy="90" r="4" fill="#ef4444" opacity="0.9" />
    <g fill="#fef08a" opacity="0.6">
      <rect x="955" y="260" width="6" height="10" />
      <rect x="970" y="280" width="6" height="10" />
      <rect x="1060" y="200" width="8" height="12" />
      <rect x="1090" y="220" width="8" height="12" />
      <rect x="1075" y="250" width="8" height="12" />
      <rect x="1190" y="260" width="8" height="10" />
      <rect x="1210" y="290" width="8" height="10" />
      <rect x="1300" y="210" width="10" height="14" fill="#38bdf8" />
      <rect x="1330" y="240" width="10" height="14" />
      <rect x="1440" y="290" width="8" height="10" />
    </g>
  </g>

  <!-- 3. Left Wall Feature - ILLUMINATED 3D CME LOGO -->
  <g id="wall-feature" transform="translate(60, 100)">
    <!-- Wall panel background -->
    <rect x="0" y="0" width="540" height="320" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    
    <!-- Glowing 3D Wall Emblem Logo -->
    <g filter="url(#logoGlow)" transform="translate(40, 40)">
      <!-- Large 'M' Monogram with Upward Trend Arrow -->
      <path d="M 20 120 L 20 20 L 45 20 L 75 75 L 105 20 L 130 20 L 130 120 L 108 120 L 108 52 L 82 102 L 68 102 L 42 52 L 42 120 Z" fill="url(#wallEmblemGold)" />
      <!-- Arrow Head overlay -->
      <polygon points="105,10 145,10 145,50" fill="#38bdf8" />
      <line x1="85" y1="70" x2="140" y2="15" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />

      <!-- CME Wordmark -->
      <text x="165" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="4" fill="#ffffff">CME</text>
      <!-- Subtitle -->
      <text x="168" y="102" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" letter-spacing="6" fill="#80D824">GLOBAL FOREX TRADING</text>
      <text x="168" y="128" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" letter-spacing="3" fill="#94a3b8">Empowering Markets &amp; Institutional Wealth</text>
    </g>
  </g>

  <!-- 4. Wall Mounted Command Center Display Screen -->
  <g id="wall-tv-screen" filter="url(#screenGlow)" transform="translate(640, 90)">
    <rect x="0" y="0" width="220" height="130" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="2" />
    <!-- TV Content -->
    <rect x="8" y="8" width="204" height="114" rx="4" fill="#090d16" />
    <text x="18" y="26" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8">CME GLOBAL PERFORMANCE</text>
    <!-- Mini Candlestick Chart -->
    <path d="M 20 90 L 50 75 L 80 85 L 110 50 L 140 60 L 170 35 L 200 40" fill="none" stroke="#10b981" stroke-width="2.5" />
    <polygon points="20,90 50,75 80,85 110,50 140,60 170,35 200,40 200,105 20,105" fill="url(#chartGreen)" opacity="0.4" />
  </g>

  <!-- 5. Trading Desks & Multi-Monitor Workstations -->
  <g id="trading-floor-desks">
    <!-- Main Trading Table Surface -->
    <polygon points="0,620 1600,620 1600,900 0,900" fill="#090d16" />
    <line x1="0" y1="620" x2="1600" y2="620" stroke="#334155" stroke-width="4" />

    <!-- Monitor Terminal 1 (Far Left) -->
    <g transform="translate(60, 420)" filter="url(#screenGlow)">
      <rect x="0" y="0" width="260" height="170" rx="10" fill="#020617" stroke="#3b82f6" stroke-width="3" />
      <rect x="8" y="8" width="244" height="154" rx="6" fill="#0f172a" />
      <!-- Logo on Terminal 1 -->
      <text x="20" y="32" font-family="sans-serif" font-weight="900" font-size="16" fill="#ffffff">CME TRADER 1</text>
      <text x="20" y="50" font-family="monospace" font-size="10" fill="#10b981">+18.42% EUR/USD BOOST</text>
      <!-- Candlesticks -->
      <line x1="30" y1="120" x2="30" y2="70" stroke="#10b981" stroke-width="2" />
      <rect x="25" y="80" width="10" height="30" fill="#10b981" />
      <line x1="55" y1="130" x2="55" y2="80" stroke="#ef4444" stroke-width="2" />
      <rect x="50" y="90" width="10" height="30" fill="#ef4444" />
      <line x1="80" y1="110" x2="80" y2="60" stroke="#10b981" stroke-width="2" />
      <rect x="75" y="65" width="10" height="35" fill="#10b981" />
      <!-- Line chart -->
      <path d="M 100 120 Q 140 70 180 90 T 240 50" fill="none" stroke="#38bdf8" stroke-width="3" />
    </g>

    <!-- Monitor Terminal 2 (Center Left - Large Screen) -->
    <g transform="translate(360, 390)" filter="url(#screenGlow)">
      <rect x="0" y="0" width="360" height="210" rx="12" fill="#020617" stroke="#f59e0b" stroke-width="3.5" />
      <rect x="10" y="10" width="340" height="190" rx="8" fill="#0a0f1d" />
      <!-- Live Trading Interface -->
      <rect x="20" y="22" width="320" height="32" rx="6" fill="#1e293b" />
      <circle cx="38" cy="38" r="8" fill="#f59e0b" />
      <text x="54" y="43" font-family="sans-serif" font-weight="900" font-size="14" fill="#ffffff">CME EXECUTION ENGINE</text>
      <text x="260" y="43" font-family="monospace" font-weight="bold" font-size="12" fill="#10b981">LIVE ESCROW</text>

      <!-- Multi-window charts -->
      <rect x="20" y="64" width="150" height="120" rx="6" fill="#020617" stroke="#1e293b" />
      <path d="M 30 150 L 60 130 L 90 140 L 120 100 L 150 110" fill="none" stroke="#f59e0b" stroke-width="2.5" />

      <rect x="180" y="64" width="160" height="120" rx="6" fill="#020617" stroke="#1e293b" />
      <path d="M 190 160 L 220 120 L 250 130 L 280 80 L 320 90" fill="none" stroke="#10b981" stroke-width="2.5" />
      <polygon points="190,160 220,120 250,130 280,80 320,90 320,175 190,175" fill="url(#chartGreen)" opacity="0.3" />
    </g>

    <!-- Monitor Terminal 3 (Center Right - Main Hub) -->
    <g transform="translate(760, 400)" filter="url(#screenGlow)">
      <rect x="0" y="0" width="340" height="200" rx="12" fill="#020617" stroke="#38bdf8" stroke-width="3.5" />
      <rect x="10" y="10" width="320" height="180" rx="8" fill="#060b14" />
      <text x="25" y="36" font-family="sans-serif" font-weight="900" font-size="15" fill="#38bdf8">CME INSTITUTIONAL DESK</text>
      <!-- Depth Orderbook simulation -->
      <rect x="25" y="50" width="130" height="125" rx="4" fill="#0f172a" />
      <text x="32" y="66" font-family="monospace" font-size="10" fill="#94a3b8">USDT/USD $1.000</text>
      <rect x="32" y="76" width="70" height="8" fill="#10b981" opacity="0.8" />
      <rect x="32" y="88" width="90" height="8" fill="#10b981" opacity="0.8" />
      <rect x="32" y="100" width="50" height="8" fill="#10b981" opacity="0.8" />
      <rect x="32" y="116" width="85" height="8" fill="#ef4444" opacity="0.8" />
      <rect x="32" y="128" width="60" height="8" fill="#ef4444" opacity="0.8" />

      <!-- Macro Chart -->
      <rect x="165" y="50" width="150" height="125" rx="4" fill="#0f172a" />
      <path d="M 175 150 L 205 130 L 235 140 L 265 90 L 305 70" fill="none" stroke="#38bdf8" stroke-width="3" />
    </g>

    <!-- Monitor Terminal 4 (Right Side) -->
    <g transform="translate(1140, 420)" filter="url(#screenGlow)">
      <rect x="0" y="0" width="280" height="180" rx="10" fill="#020617" stroke="#10b981" stroke-width="3" />
      <rect x="8" y="8" width="264" height="164" rx="6" fill="#090d16" />
      <text x="20" y="32" font-family="sans-serif" font-weight="900" font-size="16" fill="#ffffff">CME BOT DESK</text>
      <text x="20" y="52" font-family="monospace" font-size="11" fill="#f59e0b">AUTOPILOT +2.85%/day</text>
      <path d="M 20 140 Q 80 110 140 120 T 250 60" fill="none" stroke="#10b981" stroke-width="3.5" />
    </g>
  </g>

  <!-- 6. Foreground Trader Silhouettes with Headsets working -->
  <g id="traders-foreground" opacity="0.85">
    <!-- Trader 1 Center Left -->
    <path d="M 460 760 C 460 680 490 640 540 640 C 590 640 620 680 620 760 Z" fill="#0f172a" />
    <circle cx="540" cy="600" r="32" fill="#1e293b" />
    <!-- Headset -->
    <path d="M 512 600 C 512 570 568 570 568 600" fill="none" stroke="#38bdf8" stroke-width="5" />
    <rect x="506" y="592" width="8" height="16" rx="3" fill="#38bdf8" />

    <!-- Trader 2 Center Right -->
    <path d="M 880 760 C 880 670 915 630 970 630 C 1025 630 1060 670 1060 760 Z" fill="#0d1527" />
    <circle cx="970" cy="590" r="34" fill="#1e293b" />
    <!-- Headset -->
    <path d="M 940 590 C 940 558 1000 558 1000 590" fill="none" stroke="#f59e0b" stroke-width="5" />
    <rect x="996" y="582" width="8" height="16" rx="3" fill="#f59e0b" />

    <!-- Keyboard & Accessories on Desk -->
    <rect x="480" y="730" width="120" height="25" rx="4" fill="#1e293b" stroke="#334155" />
    <rect x="910" y="730" width="130" height="25" rx="4" fill="#1e293b" stroke="#334155" />
    <!-- CME Branded Mug -->
    <rect x="630" y="720" width="24" height="30" rx="4" fill="#008B47" />
    <text x="633" y="740" font-family="sans-serif" font-weight="bold" font-size="8" fill="#ffffff">CME</text>
  </g>

  <!-- Overall Ambient Lighting Overlay -->
  <rect width="1600" height="900" fill="url(#officeBg)" opacity="0.1" style="mix-blend-mode: overlay;" />
</svg>
