<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CME</title>
    <meta name="description" content="CME cryptocurrency trading, peer-to-peer (P2P) escrows, copy trading, and high-yield financial portfolios." />
    <meta property="og:title" content="CME" />
    <meta property="og:description" content="CME cryptocurrency trading, peer-to-peer (P2P) escrows, copy trading, and high-yield financial portfolios." />
    <meta property="og:url" content="https://cmel.site" />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://cmel.site" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#008B47" />
    <meta name="application-name" content="CME" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CME" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body class="bg-[#EBF9F0] overflow-x-hidden selection:bg-[#008B47]/20 selection:text-[#008B47]">
    <div id="root">
      <!-- Premium instant CSS splash loading screen -->
      <div id="splash-screen-pre" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #EBF9F0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #004D27;
        z-index: 9999;
      ">
        <style>
          @keyframes logoScalePulse {
            0%, 100% {
              transform: scale(1) translateY(0);
              box-shadow: 0 15px 30px -10px rgba(0, 139, 71, 0.25);
            }
            50% {
              transform: scale(1.06) translateY(-6px);
              box-shadow: 0 25px 45px -12px rgba(0, 139, 71, 0.45);
            }
          }
          @keyframes spinnerRotation {
            to { transform: rotate(360deg); }
          }
          @keyframes textFadeBlink {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
          }
          .splash-box {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background-color: #008B47;
            border: 2px solid #F4E100;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: logoScalePulse 2s ease-in-out infinite;
          }
          .splash-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
          }
          .splash-spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(0, 139, 71, 0.2);
            border-top: 3px solid #008B47;
            border-radius: 50%;
            animation: spinnerRotation 0.8s linear infinite;
          }
          .splash-text {
            font-size: 11px;
            font-weight: 800;
            color: #00763C;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            animation: textFadeBlink 1.5s ease-in-out infinite;
            margin-top: 4px;
          }
          .splash-glow {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, rgba(244,225,0,0.15) 50%, rgba(0,139,71,0.1) 100%);
            pointer-events: none;
          }
        </style>
        <div class="splash-box">
          <img class="splash-logo" src="/icon.svg" alt="CME" />
          <div class="splash-glow"></div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <div class="splash-spinner"></div>
          <span class="splash-text">CME</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
